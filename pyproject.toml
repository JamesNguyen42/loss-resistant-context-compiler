[build-system]
requires = ["setuptools>=77", "wheel>=0.41"]
build-backend = "_ctxc_build_backend"
backend-path = ["."]

[project]
name = "loss-resistant-context-compiler"
version = "0.1.0"
description = "A model-agnostic, provenance-preserving context compiler for long-running agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JamesNguyen42" }]
keywords = ["agents", "context", "compression", "memory", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/JamesNguyen42/loss-resistant-context-compiler"
Issues = "https://github.com/JamesNguyen42/loss-resistant-context-compiler/issues"

[project.optional-dependencies]
unified = [
  "localai-contracts==0.2.0a2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "setuptools>=77",
  "wheel>=0.41",
]

[project.scripts]
ctxc = "context_compiler.cli:main"
ctxc-localai-contracts = "context_compiler.localai_contracts_connector:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/loss-resistant-context-compiler/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
