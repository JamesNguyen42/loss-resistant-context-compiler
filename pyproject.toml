[build-system]
requires = ["setuptools>=65", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "lossless-context-compiler"
version = "0.1.0"
description = "A model-agnostic, provenance-preserving context compiler for long-running agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JamesNguyen42" }]
keywords = ["agents", "context", "compression", "memory", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "wheel>=0.41"]

[project.scripts]
ctxc = "context_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/lossless-context-compiler/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
