name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run the complete test suite
        run: python -m pytest -q
      - name: Run static checks
        run: >-
          python -m ruff check
          src tests benchmarks scripts conformance _ctxc_build_backend.py
      - name: Compile all Python sources
        run: >-
          python -m compileall -q
          src benchmarks tests scripts conformance _ctxc_build_backend.py

  platform-smoke:
    name: release and filesystem smoke (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1700000000"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.lock
      - name: Provision the hash-bound release builder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-build-wheelhouse | Out-Null
          python -m pip --isolated download --no-deps --only-binary=:all: `
            --require-hashes `
            --requirement requirements-build.lock `
            --dest ci-build-wheelhouse
          if ($LASTEXITCODE -ne 0) {
            throw "build-wheel acquisition failed with exit code $LASTEXITCODE"
          }
          python -c "import pathlib; root=pathlib.Path('ci-build-wheelhouse'); expected={'build-1.5.0-py3-none-any.whl','colorama-0.4.6-py2.py3-none-any.whl','packaging-26.2-py3-none-any.whl','pip-25.0.1-py3-none-any.whl','pyproject_hooks-1.2.0-py3-none-any.whl','setuptools-83.0.0-py3-none-any.whl','wheel-0.47.0-py3-none-any.whl'}; entries=list(root.iterdir()); assert {path.name for path in entries} == expected, (entries, expected); assert all(path.is_file() and not path.is_symlink() and path.stat().st_nlink == 1 for path in entries), entries"
          if ($LASTEXITCODE -ne 0) {
            throw "build-wheel inventory validation failed with exit code $LASTEXITCODE"
          }
          python -m venv ci-build-environment
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder creation failed with exit code $LASTEXITCODE"
          }
          $relativeBuildPython = if ($IsWindows) {
            "Scripts/python.exe"
          } else {
            "bin/python"
          }
          $buildPython = Join-Path `
            (Resolve-Path -LiteralPath ci-build-environment).Path `
            $relativeBuildPython
          if (-not (Test-Path -LiteralPath $buildPython -PathType Leaf)) {
            throw "dedicated build Python is absent"
          }
          & $buildPython -m pip --isolated install --disable-pip-version-check `
            --no-deps `
            --no-index `
            --find-links ci-build-wheelhouse `
            --only-binary=:all: `
            --require-hashes `
            --force-reinstall `
            --requirement requirements-build.lock
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder installation failed with exit code $LASTEXITCODE"
          }
          & $buildPython -m pip --isolated check
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder dependency check failed with exit code $LASTEXITCODE"
          }
          & $buildPython -c "import importlib.metadata as m,re; expected={'build':'1.5.0','colorama':'0.4.6','packaging':'26.2','pip':'25.0.1','pyproject-hooks':'1.2.0','setuptools':'83.0.0','wheel':'0.47.0'}; distributions=list(m.distributions()); actual={re.sub(r'[-_.]+','-',item.metadata['Name']).lower():item.version for item in distributions}; assert len(distributions) == 7 and actual == expected, (actual, expected)"
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder inventory validation failed with exit code $LASTEXITCODE"
          }
          Add-Content -Encoding utf8NoBOM -LiteralPath $env:GITHUB_ENV `
            -Value "CTXC_BUILD_PYTHON=$buildPython"
          python -VV | Set-Content -Encoding utf8NoBOM release-build-toolchain.txt
          python -m pip --isolated --version |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          "dedicated release builder:" |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          & $buildPython -VV |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          & $buildPython -m pip --isolated freeze --all |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
      - name: Install development package
        run: python -m pip install -e ".[dev]"
      - name: Run cross-platform filesystem regressions
        run: >-
          python -m pytest -q
          tests/test_archive_locking.py
          tests/test_archive_file_safety.py
          tests/test_compile_deadline.py
          tests/test_deterministic_sdist.py
          tests/test_external_runner.py
          tests/test_local_qwen.py
          tests/test_parent_directory_safety.py
          tests/test_release_install_smoke.py
          tests/test_standalone_without_localai_contracts.py
      - name: Build wheel and source distribution
        shell: pwsh
        run: |
          & $env:CTXC_BUILD_PYTHON -m pip --isolated wheel . `
            --no-build-isolation `
            --no-index `
            --no-deps `
            --wheel-dir dist
          if ($LASTEXITCODE -ne 0) {
            throw "wheel build failed with exit code $LASTEXITCODE"
          }
          & $env:CTXC_BUILD_PYTHON -m _ctxc_build_backend --sdist-dir dist
          if ($LASTEXITCODE -ne 0) {
            throw "source-distribution build failed with exit code $LASTEXITCODE"
          }
      - name: Install and smoke-test wheel and sdist separately
        shell: pwsh
        run: |
          $smokeLines = @(& python scripts/release_install_smoke.py `
            --dist-dir dist `
            --schema-dir schemas `
            --build-wheelhouse ci-build-wheelhouse `
            --build-requirements requirements-build.lock 2>&1)
          $smokeExit = $LASTEXITCODE
          $smokeLines | Set-Content -Encoding utf8NoBOM release-install-smoke.log
          $smokeLines | Write-Output
          if ($smokeExit -ne 0) {
            throw "release install smoke failed with exit code $smokeExit"
          }
          $reportLines = @($smokeLines | Where-Object {
            "$_".Trim().StartsWith('{"artifacts":')
          })
          if ($reportLines.Count -ne 1) {
            throw "release install smoke did not emit one final JSON report"
          }
          "$($reportLines[0])".Trim() |
            Set-Content -Encoding utf8NoBOM release-install-smoke.json
          python -c "import json,pathlib; report=json.loads(pathlib.Path('release-install-smoke.json').read_text(encoding='utf-8')); assert set(report)=={'schema','schema_count','artifacts'} and report['schema']=='ctxc-release-install-smoke-0.1' and isinstance(report['schema_count'],int) and not isinstance(report['schema_count'],bool) and report['schema_count']>0; artifacts=report['artifacts']; assert isinstance(artifacts,list) and len(artifacts)==2; assert all(isinstance(item,dict) and set(item)=={'artifact','kind','status','build_bootstrap'} for item in artifacts); by_kind={item['kind']:item for item in artifacts}; assert set(by_kind)=={'wheel','sdist'} and all(item['status']=='passed' for item in artifacts); assert by_kind['wheel']['build_bootstrap']=='not-applicable' and by_kind['sdist']['build_bootstrap']=='hash-pinned-offline-wheelhouse'"
      - name: Retain cross-platform release smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-release-smoke-${{ runner.os }}-python-3.13
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-install-smoke.json
            release-install-smoke.log
            release-build-toolchain.txt
            requirements-build.lock
            ci-build-wheelhouse/*.whl
          if-no-files-found: warn
          retention-days: 14

  reproducibility:
    name: exact repeated release builds
    needs: [unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-first
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-second
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            source-first/pyproject.toml
            source-first/requirements-build.lock
      - name: Provision and record the hash-bound same-job release builder
        shell: pwsh
        run: |
          $firstLockHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath source-first/requirements-build.lock).Hash
          $secondLockHash = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath source-second/requirements-build.lock).Hash
          if ($firstLockHash -ne $secondLockHash) {
            throw "clean-checkout build locks differ"
          }
          Copy-Item -LiteralPath source-first/requirements-build.lock `
            -Destination release-requirements-build.lock
          New-Item -ItemType Directory -Path ci-build-wheelhouse | Out-Null
          python -m pip --isolated download --no-deps --only-binary=:all: `
            --require-hashes `
            --requirement release-requirements-build.lock `
            --dest ci-build-wheelhouse
          if ($LASTEXITCODE -ne 0) {
            throw "build-wheel acquisition failed with exit code $LASTEXITCODE"
          }
          python -c "import pathlib; root=pathlib.Path('ci-build-wheelhouse'); expected={'build-1.5.0-py3-none-any.whl','colorama-0.4.6-py2.py3-none-any.whl','packaging-26.2-py3-none-any.whl','pip-25.0.1-py3-none-any.whl','pyproject_hooks-1.2.0-py3-none-any.whl','setuptools-83.0.0-py3-none-any.whl','wheel-0.47.0-py3-none-any.whl'}; entries=list(root.iterdir()); assert {path.name for path in entries} == expected, (entries, expected); assert all(path.is_file() and not path.is_symlink() and path.stat().st_nlink == 1 for path in entries), entries"
          if ($LASTEXITCODE -ne 0) {
            throw "build-wheel inventory validation failed with exit code $LASTEXITCODE"
          }
          python -m venv ci-build-environment
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder creation failed with exit code $LASTEXITCODE"
          }
          $relativeBuildPython = if ($IsWindows) {
            "Scripts/python.exe"
          } else {
            "bin/python"
          }
          $buildPython = Join-Path `
            (Resolve-Path -LiteralPath ci-build-environment).Path `
            $relativeBuildPython
          if (-not (Test-Path -LiteralPath $buildPython -PathType Leaf)) {
            throw "dedicated build Python is absent"
          }
          & $buildPython -m pip --isolated install --disable-pip-version-check `
            --no-deps `
            --no-index `
            --find-links ci-build-wheelhouse `
            --only-binary=:all: `
            --require-hashes `
            --force-reinstall `
            --requirement release-requirements-build.lock
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder installation failed with exit code $LASTEXITCODE"
          }
          & $buildPython -m pip --isolated check
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder dependency check failed with exit code $LASTEXITCODE"
          }
          & $buildPython -c "import importlib.metadata as m,re; expected={'build':'1.5.0','colorama':'0.4.6','packaging':'26.2','pip':'25.0.1','pyproject-hooks':'1.2.0','setuptools':'83.0.0','wheel':'0.47.0'}; distributions=list(m.distributions()); actual={re.sub(r'[-_.]+','-',item.metadata['Name']).lower():item.version for item in distributions}; assert len(distributions) == 7 and actual == expected, (actual, expected)"
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder inventory validation failed with exit code $LASTEXITCODE"
          }
          Add-Content -Encoding utf8NoBOM -LiteralPath $env:GITHUB_ENV `
            -Value "CTXC_BUILD_PYTHON=$buildPython"
          python -VV | Set-Content -Encoding utf8NoBOM release-python.txt
          python -m pip --isolated --version |
            Set-Content -Encoding utf8NoBOM release-build-toolchain.txt
          "dedicated release builder:" |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          & $buildPython -VV |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          & $buildPython -m pip --isolated freeze --all |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
      - name: Build the first clean candidate
        working-directory: source-first
        shell: pwsh
        run: |
          & $env:CTXC_BUILD_PYTHON -m pip --isolated wheel . `
            --no-build-isolation `
            --no-index `
            --no-deps `
            --wheel-dir ../dist-first
          if ($LASTEXITCODE -ne 0) {
            throw "first wheel build failed with exit code $LASTEXITCODE"
          }
          & $env:CTXC_BUILD_PYTHON -m _ctxc_build_backend --sdist-dir ../dist-first
          if ($LASTEXITCODE -ne 0) {
            throw "first source-distribution build failed with exit code $LASTEXITCODE"
          }
      - name: Build the second clean candidate
        working-directory: source-second
        shell: pwsh
        run: |
          & $env:CTXC_BUILD_PYTHON -m pip --isolated wheel . `
            --no-build-isolation `
            --no-index `
            --no-deps `
            --wheel-dir ../dist-second
          if ($LASTEXITCODE -ne 0) {
            throw "second wheel build failed with exit code $LASTEXITCODE"
          }
          & $env:CTXC_BUILD_PYTHON -m _ctxc_build_backend --sdist-dir ../dist-second
          if ($LASTEXITCODE -ne 0) {
            throw "second source-distribution build failed with exit code $LASTEXITCODE"
          }
      - name: Require byte-identical wheel and sdist outputs
        working-directory: source-first
        env:
          PYTHONPATH: src
        run: >-
          python -m scripts.release_reproducibility
          --first-dist ../dist-first
          --second-dist ../dist-second
          --json-out ../release-reproducibility.json
      - name: Retain repeated-build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-release-builds-python-3.13
          path: |
            dist-first/*.whl
            dist-first/*.tar.gz
            dist-second/*.whl
            dist-second/*.tar.gz
            release-reproducibility.json
            release-python.txt
            release-build-toolchain.txt
            release-requirements-build.lock
            ci-build-wheelhouse/*.whl
          if-no-files-found: error

  benchmark:
    name: LRCBench (24 histories)
    needs: [unit-tests, platform-smoke, reproducibility]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.lock
      - name: Provision the hash-bound release builder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ci-build-wheelhouse | Out-Null
          python -m pip --isolated download --no-deps --only-binary=:all: `
            --require-hashes `
            --requirement requirements-build.lock `
            --dest ci-build-wheelhouse
          if ($LASTEXITCODE -ne 0) {
            throw "build-wheel acquisition failed with exit code $LASTEXITCODE"
          }
          python -c "import pathlib; root=pathlib.Path('ci-build-wheelhouse'); expected={'build-1.5.0-py3-none-any.whl','colorama-0.4.6-py2.py3-none-any.whl','packaging-26.2-py3-none-any.whl','pip-25.0.1-py3-none-any.whl','pyproject_hooks-1.2.0-py3-none-any.whl','setuptools-83.0.0-py3-none-any.whl','wheel-0.47.0-py3-none-any.whl'}; entries=list(root.iterdir()); assert {path.name for path in entries} == expected, (entries, expected); assert all(path.is_file() and not path.is_symlink() and path.stat().st_nlink == 1 for path in entries), entries"
          if ($LASTEXITCODE -ne 0) {
            throw "build-wheel inventory validation failed with exit code $LASTEXITCODE"
          }
          python -m venv ci-build-environment
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder creation failed with exit code $LASTEXITCODE"
          }
          $relativeBuildPython = if ($IsWindows) {
            "Scripts/python.exe"
          } else {
            "bin/python"
          }
          $buildPython = Join-Path `
            (Resolve-Path -LiteralPath ci-build-environment).Path `
            $relativeBuildPython
          if (-not (Test-Path -LiteralPath $buildPython -PathType Leaf)) {
            throw "dedicated build Python is absent"
          }
          & $buildPython -m pip --isolated install --disable-pip-version-check `
            --no-deps `
            --no-index `
            --find-links ci-build-wheelhouse `
            --only-binary=:all: `
            --require-hashes `
            --force-reinstall `
            --requirement requirements-build.lock
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder installation failed with exit code $LASTEXITCODE"
          }
          & $buildPython -m pip --isolated check
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder dependency check failed with exit code $LASTEXITCODE"
          }
          & $buildPython -c "import importlib.metadata as m,re; expected={'build':'1.5.0','colorama':'0.4.6','packaging':'26.2','pip':'25.0.1','pyproject-hooks':'1.2.0','setuptools':'83.0.0','wheel':'0.47.0'}; distributions=list(m.distributions()); actual={re.sub(r'[-_.]+','-',item.metadata['Name']).lower():item.version for item in distributions}; assert len(distributions) == 7 and actual == expected, (actual, expected)"
          if ($LASTEXITCODE -ne 0) {
            throw "dedicated builder inventory validation failed with exit code $LASTEXITCODE"
          }
          Add-Content -Encoding utf8NoBOM -LiteralPath $env:GITHUB_ENV `
            -Value "CTXC_BUILD_PYTHON=$buildPython"
          python -VV | Set-Content -Encoding utf8NoBOM release-build-toolchain.txt
          python -m pip --isolated --version |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          "dedicated release builder:" |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          & $buildPython -VV |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
          & $buildPython -m pip --isolated freeze --all |
            Add-Content -Encoding utf8NoBOM release-build-toolchain.txt
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Build release archives and verify packaged contents
        shell: pwsh
        run: |
          & $env:CTXC_BUILD_PYTHON -m pip --isolated wheel . `
            --no-build-isolation `
            --no-index `
            --no-deps `
            --wheel-dir dist
          if ($LASTEXITCODE -ne 0) {
            throw "wheel build failed with exit code $LASTEXITCODE"
          }
          & $env:CTXC_BUILD_PYTHON -m _ctxc_build_backend --sdist-dir dist
          if ($LASTEXITCODE -ne 0) {
            throw "source-distribution build failed with exit code $LASTEXITCODE"
          }
          python -c "import glob, os, pathlib, tarfile, zipfile; w=glob.glob('dist/*.whl'); s=glob.glob('dist/*.tar.gz'); assert len(w)==len(s)==1, (w,s); assert os.path.basename(w[0]).startswith('loss_resistant_context_compiler-'); expected={p.name for p in pathlib.Path('schemas').glob('*.schema.json')}; installed={pathlib.Path(n).name for n in zipfile.ZipFile(w[0]).namelist() if n.endswith('.schema.json')}; assert installed==expected, (installed,expected); sn=tarfile.open(s[0]).getnames(); required=('_ctxc_build_backend.py','requirements-build.lock','CHANGELOG.md','CONTRIBUTING.md','SECURITY.md','SUPPORT.md','docs/RELEASE_POLICY.md','docs/RELEASE_CHECKLIST.md','docs/SUPPLY_CHAIN.md','benchmarks/lrcbench.py','benchmarks/natural_history.py','benchmarks/compatibility/acon-diagnostic-failed-manifest.json','conformance/run_connector_conformance.py','conformance/fixtures/golden-success.jsonl','conformance/fixtures/golden-negative.jsonl','scripts/release_install_smoke.py','scripts/release_artifact_manifest.py'); assert all(any(n.endswith('/'+r) for n in sn) for r in required), sn; assert sum('/benchmarks/schemas/natural-history/' in n and n.endswith('.schema.json') for n in sn)==6, sn; assert sum('/benchmarks/data/natural_history/' in n and n.endswith('.json') for n in sn)==7, sn"
      - name: Retain and verify release archive checksums
        run: |
          python -m scripts.release_artifact_manifest create --dist-dir dist --revision "${{ github.sha }}" --manifest-out dist/release-artifacts.json --checksums-out dist/SHA256SUMS
          python -m scripts.release_artifact_manifest verify --dist-dir dist --manifest dist/release-artifacts.json --checksums dist/SHA256SUMS
      - name: Install wheel and sdist in clean environments
        shell: pwsh
        run: |
          $smokeLines = @(& python scripts/release_install_smoke.py `
            --dist-dir dist `
            --schema-dir schemas `
            --build-wheelhouse ci-build-wheelhouse `
            --build-requirements requirements-build.lock 2>&1)
          $smokeExit = $LASTEXITCODE
          $smokeLines | Set-Content -Encoding utf8NoBOM release-install-smoke.log
          $smokeLines | Write-Output
          if ($smokeExit -ne 0) {
            throw "release install smoke failed with exit code $smokeExit"
          }
          $reportLines = @($smokeLines | Where-Object {
            "$_".Trim().StartsWith('{"artifacts":')
          })
          if ($reportLines.Count -ne 1) {
            throw "release install smoke did not emit one final JSON report"
          }
          "$($reportLines[0])".Trim() |
            Set-Content -Encoding utf8NoBOM release-install-smoke.json
          python -c "import json,pathlib; report=json.loads(pathlib.Path('release-install-smoke.json').read_text(encoding='utf-8')); assert set(report)=={'schema','schema_count','artifacts'} and report['schema']=='ctxc-release-install-smoke-0.1' and isinstance(report['schema_count'],int) and not isinstance(report['schema_count'],bool) and report['schema_count']>0; artifacts=report['artifacts']; assert isinstance(artifacts,list) and len(artifacts)==2; assert all(isinstance(item,dict) and set(item)=={'artifact','kind','status','build_bootstrap'} for item in artifacts); by_kind={item['kind']:item for item in artifacts}; assert set(by_kind)=={'wheel','sdist'} and all(item['status']=='passed' for item in artifacts); assert by_kind['wheel']['build_bootstrap']=='not-applicable' and by_kind['sdist']['build_bootstrap']=='hash-pinned-offline-wheelhouse'"
      - name: Validate external candidate interchange
        run: python -m benchmarks --self-test
      - name: Verify external protocol readiness artifact
        run: >-
          python -m benchmarks.external_protocol
          --verify benchmarks/protocols/external-comparison-v1.json
      - name: Validate connector schemas and transcripts
        run: python conformance/run_connector_conformance.py
      - name: Validate natural-history contract fixtures
        run: python -m benchmarks.natural_history
      - name: Replay frozen diagnostic evidence offline
        run: |
          python -m benchmarks --verify-report docs/results/lrcbench-local.json
          python -m benchmarks.phrase_eval --verify-report docs/results/novel-english-phrases-v1.json
          python -m benchmarks.qwen_phrase_eval --verify-report docs/results/qwen-novel-english-phrases-v1.json
          python -m benchmarks.qwen_literal_ablation --verify-report docs/results/qwen-literal-offset-ablation-v1.json
          python -m benchmarks.qwen_paired_eval --verify-report docs/results/qwen-heldout-paired-extractors-v1.json
      - name: Run the fail-closed 24-history certificate
        run: >-
          python -m benchmarks
          --histories 24
          --json-out lrcbench-24.json
          --include-histories
      - name: Run the bounded compiler performance gate
        run: >-
          python -m benchmarks.performance_gate
          --check
          --json-out ctxc-performance.json
      - name: Upload auditable benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lrcbench-24-python-3.11
          path: |
            lrcbench-24.json
            ctxc-performance.json
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-artifacts.json
            release-install-smoke.json
            release-install-smoke.log
            release-build-toolchain.txt
            requirements-build.lock
            ci-build-wheelhouse/*.whl
          if-no-files-found: warn
