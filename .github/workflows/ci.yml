name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run the complete test suite
        run: python -m pytest -q
      - name: Run static checks
        run: python -m ruff check src tests benchmarks

  benchmark:
    name: LRCBench (24 histories)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Build release archives and verify packaged contents
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -c "import setuptools.build_meta as backend; backend.build_sdist('dist')"
          python -c "import glob, os, tarfile, zipfile; w=glob.glob('dist/*.whl'); s=glob.glob('dist/*.tar.gz'); assert len(w)==len(s)==1, (w,s); assert os.path.basename(w[0]).startswith('loss_resistant_context_compiler-'); wn=zipfile.ZipFile(w[0]).namelist(); assert sum(n.endswith('.schema.json') for n in wn)==8, wn; sn=tarfile.open(s[0]).getnames(); required=('CHANGELOG.md','SUPPORT.md','docs/RELEASE_POLICY.md','benchmarks/lrcbench.py'); assert all(any(n.endswith('/'+r) for n in sn) for r in required), sn"
      - name: Install the wheel in a clean environment
        run: |
          python -m venv .clean-install
          .clean-install/bin/python -m pip install --no-index --no-deps dist/*.whl
          .clean-install/bin/python -c "import pathlib, sys, context_compiler; assert context_compiler.__version__ == '0.1.0'; p=pathlib.Path(sys.prefix)/'share'/'loss-resistant-context-compiler'/'schemas'; assert len(list(p.glob('*.json'))) == 8, p"
          .clean-install/bin/ctxc --help
          printf '%s\n' '[{"role":"user","content":"constraint: preserve the release contract"}]' > .clean-install/trust-sources.json
          .clean-install/bin/ctxc compile .clean-install/trust-sources.json -o .clean-install/trust-artifact.json
          .clean-install/bin/ctxc trust create .clean-install/trust-artifact.json .clean-install/trust-sources.json -o .clean-install/trust-manifest.json
          TRUST_ANCHOR=$(.clean-install/bin/python -c "import json; print(json.load(open('.clean-install/trust-manifest.json', encoding='utf-8'))['manifest_sha256'])")
          .clean-install/bin/ctxc trust verify .clean-install/trust-manifest.json .clean-install/trust-artifact.json .clean-install/trust-sources.json --expected-manifest-sha256 "$TRUST_ANCHOR" -o .clean-install/trust-report.json
          .clean-install/bin/python -c "import json; r=json.load(open('.clean-install/trust-report.json', encoding='utf-8')); assert r['passed'] and r['anchored'] and all(r['checks'].values()), r"
      - name: Validate external candidate interchange
        run: python -m benchmarks --self-test
      - name: Verify external protocol readiness artifact
        run: >-
          python -m benchmarks.external_protocol
          --verify benchmarks/protocols/external-comparison-v1.json
      - name: Replay frozen diagnostic evidence offline
        run: |
          python -m benchmarks --verify-report docs/results/lrcbench-local.json
          python -m benchmarks.phrase_eval --verify-report docs/results/novel-english-phrases-v1.json
          python -m benchmarks.qwen_phrase_eval --verify-report docs/results/qwen-novel-english-phrases-v1.json
          python -m benchmarks.qwen_literal_ablation --verify-report docs/results/qwen-literal-offset-ablation-v1.json
          python -m benchmarks.qwen_paired_eval --verify-report docs/results/qwen-heldout-paired-extractors-v1.json
      - name: Run the fail-closed 24-history certificate
        run: >-
          python -m benchmarks
          --histories 24
          --json-out lrcbench-24.json
          --include-histories
      - name: Run the bounded compiler performance gate
        run: >-
          python -m benchmarks.performance_gate
          --check
          --json-out ctxc-performance.json
      - name: Upload auditable benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrcbench-24-python-3.11
          path: |
            lrcbench-24.json
            ctxc-performance.json
          if-no-files-found: warn
